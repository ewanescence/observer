services:
  observer:
    build: .
    container_name: observer
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - observer_data:/data
    networks:
      - proxy

volumes:
  observer_data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-caddy}
